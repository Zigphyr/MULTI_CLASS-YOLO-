[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yolocount-mc-qvi"
version = "0.1.0"
description = "YOLO-Count multi-class extension (Model B) with optional Query-Visual Interaction (Model C)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["yolocount_mc*"]
